name: Auto Update Stock Prices

on:
  schedule:
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python update_pms.py
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto update prices" || exit 0
          git push
```eof

### 🛠️ 替換步驟

1. 在 GitHub 頁面上點擊 **`< Code`** ➔ 進入 `.github/workflows` 資料夾 ➔ 點擊 **`update.yml`**。
2. 點擊右上角 **鉛筆圖示 ✏️ (Edit this file)**。
3. 全選並刪除裡面的舊內容，貼上我剛剛產生的這份完全正確縮排的 YAML 程式碼。
4. 點擊右上角綠色按鈕 **`Commit changes...` ➔ `Commit changes`**。

替換存檔後，回到 **`Actions`** 頁籤點擊 **`Run workflow`**，就能順利通過並跑出綠色勾勾了！
